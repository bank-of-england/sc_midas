name: Package quality

# Run quality checks for pull requests targeting main or dev.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Tests, package, lint, documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package, development, and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Build and inspect distribution
        run: |
          python -m build
          python -m twine check dist/*

      - name: Run Ruff linter
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Check generated API documentation
        run: |
          python scripts/generate_api_docs.py
          git diff --exit-code -- docs/api.md

      - name: Check documentation
        run: |
          pydoclint --style=numpy .
          zensical build --clean --strict

      - name: Run tests
        run: pytest

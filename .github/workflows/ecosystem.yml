name: OPERA ecosystem pipelines

# Build this module's wheel, install it into the ecosystem pinned by
# opera-eco[test], and run opera-eco's shared contract and pipeline tests.
#
# Runs only on pull requests targeting main or dev, and is skipped for
# Release Please pull requests: those only bump the version and changelog, so
# the candidate wheel is one patch ahead of the pinned ecosystem and
# opera-eco's skill-version check would fail on that gap alone.

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ecosystem:
    name: Ecosystem gate
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out module
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.13"
          cache: pip

      - name: Build candidate wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install pinned ecosystem
        run: python -m pip install "opera-eco[test]"

      - name: Install candidate wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify dependencies
        run: python -m pip check

      - name: Run ecosystem contract tests
        run: pytest --pyargs opera.tests -m contract -vv

      - name: Run ecosystem pipeline tests
        run: pytest --pyargs opera.tests -m pipeline -vv
